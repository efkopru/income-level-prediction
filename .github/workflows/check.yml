name: R checks

env:
  LC_ALL: C
  TZ: UTC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript --vanilla scripts/install_dependencies.R
      - name: Run offline checks
        run: Rscript --vanilla tests/run_tests.R
      - name: Run downloaded-data smoke check
        run: Rscript --vanilla IncomeLevelPrediction.R --download --smoke --output results/ci-smoke
